  "info": {
    "title": "Herdr Bridge browser API",
    "version": "1.0.0",
    "description": "Same-origin cookies; mutation requests require exact Origin and CSRF. Password changes revoke all login sessions. Layout writes use compare-and-swap and return 409 on conflict. Admin privileges never bypass bridge ownership. Password limits are UTF-8 byte limits on the server."
